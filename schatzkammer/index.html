<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernspiele">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../gemeinsam/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../gemeinsam/icons/apple-touch-icon.png">
<title>Schatzkammer</title>
<link rel="stylesheet" href="../gemeinsam/theme.css">
<link rel="stylesheet" href="schatzkammer.css">
<script src="../gemeinsam/thema.js"></script>
<script type="module" src="../gemeinsam/app.js"></script>
<script type="module" src="schatzkammer.js"></script>
</head>
<body>
<main class="schatz-seite">
  <header>
    <a class="info-btn" href="../" aria-label="Zur Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="titel">
      <h1>Schatzkammer</h1>
      <p class="sub" id="anzahl"></p>
    </div>
    <button type="button" class="info-btn" data-thema-knopf aria-label="Nachtmodus einschalten"></button>
  </header>

  <section class="jetzt" aria-labelledby="t-jetzt">
    <div class="jetzt-bild" id="jetzt"></div>
    <div class="jetzt-text">
      <h2 id="t-jetzt">Dein nächstes Amulett</h2>
      <p id="jetzt-text"></p>
      <a class="btn primary" id="b-spiel" href="../leuchttisch/">Zum Leuchttisch</a>
    </div>
  </section>

  <section aria-labelledby="t-amulette">
    <h2 id="t-amulette">Deine Amulette</h2>
    <div class="raster" id="amulette"></div>
  </section>

  <section aria-labelledby="t-album">
    <h2 id="t-album">Alle Modelle</h2>
    <div class="fortschritt"><div class="balken"><i id="album-balken"></i></div><span id="album-zahl"></span></div>
    <div class="raster album" id="album"></div>
  </section>
</main>
</body>
</html>
