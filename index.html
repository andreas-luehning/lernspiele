<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Lernspiele</title>
<link rel="stylesheet" href="gemeinsam/theme.css">
<link rel="stylesheet" href="startseite.css">
<script src="gemeinsam/thema.js"></script>
</head>
<body>
<main class="start">
  <header>
    <div>
      <h1>Lernspiele</h1>
      <p class="sub">Rechnen bis 20</p>
    </div>
    <button class="info-btn" data-thema-knopf type="button" aria-label="Nachtmodus einschalten"></button>
  </header>

  <ul class="kacheln">
    <li>
      <a class="kachel" href="zehnerweg/">
        <svg class="bild" viewBox="0 0 200 120" aria-hidden="true">
          <rect class="k-road" x="20" y="88" width="160" height="14" rx="2"/>
          <path class="k-arr" d="M40 74 Q40 54 54 50"/>
          <path class="k-arr" d="M84 40 Q90 22 98 22"/>
          <path class="k-arr" d="M122 22 Q132 22 138 40"/>
          <path class="k-arr" d="M146 54 Q160 58 160 74"/>
          <rect class="k-start" x="20" y="74" width="40" height="34" rx="7"/>
          <ellipse class="k-oval" cx="100" cy="95" rx="22" ry="16"/>
          <ellipse class="k-oval" cx="70" cy="52" rx="18" ry="13"/>
          <rect class="k-ten" x="80" y="6" width="40" height="30" rx="7"/>
          <ellipse class="k-oval" cx="130" cy="52" rx="18" ry="13"/>
          <rect class="k-goal" x="140" y="74" width="40" height="34" rx="7"/>
          <text x="100" y="27" text-anchor="middle">10</text>
        </svg>
        <span class="name">Zehnerweg</span>
        <span class="was">Über die 10 rechnen</span>
      </a>
    </li>
    <li>
      <a class="kachel" href="leuchttisch/">
        <svg class="bild" viewBox="0 0 200 120" aria-hidden="true">
          <rect class="k-rahmen" x="10" y="6" width="180" height="108" rx="16"/>
          <rect class="k-tisch" x="18" y="14" width="164" height="92" rx="11"/>
          <path class="k-st k-rot" d="M52 30 C58 40 64 46 64 52 a12 12 0 1 1 -24 0 C40 46 46 40 52 30 Z"/>
          <polygon class="k-st k-blau" points="98,34 112,52 98,70 84,52"/>
          <polygon class="k-st k-gruen" points="140,30 152,30 160,38 160,50 152,58 140,58 132,50 132,38"/>
          <polygon class="k-st k-lila" points="70,70 82,77 82,91 70,98 58,91 58,77"/>
          <ellipse class="k-st k-orange" cx="146" cy="84" rx="11" ry="14"/>
        </svg>
        <span class="name">Leuchttisch</span>
        <span class="was">Edelsteine zählen, Amulette sammeln</span>
      </a>
    </li>
  </ul>

  <p class="fuss">Alles bleibt auf diesem Gerät. Keine Anmeldung, keine Werbung.</p>
</main>
</body>
</html>
